<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran with Tajweed – Beginner Learning App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0d6b4c;
      --primary-dark: #085338;
      --primary-light: #e8f5f0;
      --gold: #c9a227;
      --gold-light: #f8f1d4;
      --text: #1a1a1a;
      --text-muted: #5a5a5a;
      --bg: #faf9f6;
      --card: #ffffff;
      --border: #e5e0d8;
      --success: #2e7d32;
      --warning: #ed6c02;
      --danger: #c62828;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .arabic {
      font-family: 'Amiri', 'Scheherazade New', 'Traditional Arabic', serif;
      direction: rtl;
      font-size: 1.8rem;
      line-height: 2.2;
    }

    .arabic-lg {
      font-size: 2.4rem;
      line-height: 2.4;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 1.5rem 1rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 140%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      position: relative;
    }

    header p {
      opacity: 0.9;
      font-size: 0.95rem;
      position: relative;
    }

    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 1.4rem;
      margin-top: 0.75rem;
      opacity: 0.95;
    }

    nav {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    nav button {
      flex-shrink: 0;
      padding: 0.55rem 1.1rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    nav button.active {
      background: var(--primary);
      color: white;
    }

    nav button:hover:not(.active) {
      background: var(--primary-light);
      color: var(--primary);
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }

    .section {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .section.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card h3 {
      font-size: 1.05rem;
      margin: 1.25rem 0 0.5rem;
      color: var(--primary-dark);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
